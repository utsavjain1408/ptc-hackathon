services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol (clients connect here)
      - "3001:3000"   # Browser UI: http://localhost:3001 (3000 is taken by open-webui)
    volumes:
      - falkordb-data:/var/lib/falkordb/data

volumes:
  falkordb-data:
